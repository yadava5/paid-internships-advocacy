     role="img" aria-label="Paid Internships Now. Experience Shouldn’t Cost You.">
  <title>Paid Internships Now</title>
  <style>
    .name { font: 700 44px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
            Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: -1px; }
    .desc { font: 400 18px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
